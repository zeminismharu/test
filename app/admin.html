<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>작업 계획 · 레퍼런스</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body class="admin">
  <!-- 보드 목록 -->
  <div id="listScreen">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="back-link" href="/"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>레퍼런스</a>
        <button class="text-btn" id="logoutBtn" type="button" hidden>로그아웃</button>
      </div>
    </header>
    <main class="page">
      <h1 class="admin-title">작업 계획</h1>
      <p class="admin-sub">조명 위치와 색온도(K), 앞으로 할 일을 직접 그려서 계획해요.</p>

      <div id="loginBox" class="card login-card" hidden>
        <p class="login-text">관리 화면은 비밀번호가 필요해요.</p>
        <form class="form" id="loginForm">
          <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required />
          <button class="btn block" id="pwBtn" type="submit">로그인</button>
        </form>
      </div>

      <div id="boardsBox" hidden>
        <button class="new-board" id="newBoard" type="button">
          <span class="new-plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
          <span><strong>새 계획 만들기</strong><small>빈 도화지에 그리거나 도면·사진 위에 그려요</small></span>
        </button>
        <ul class="board-list" id="boardList"></ul>
      </div>
    </main>
  </div>

  <!-- 보드 편집 -->
  <div id="editorScreen" class="editor" hidden>
    <header class="ed-top">
      <button class="icon-btn" id="edBack" type="button" aria-label="목록으로"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <input class="ed-title" id="edTitle" maxlength="200" placeholder="계획 이름" />
      <span class="save-state" id="saveState"></span>
      <button class="icon-btn" id="edMore" type="button" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
      <button class="panel-toggle" id="panelToggle" type="button">계획 · 조명 목록</button>
    </header>

    <div class="ed-body">
      <div class="stage" id="stage">
        <svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="gridSmall" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#f2f4f6" stroke-width="1"/></pattern>
            <pattern id="gridBig" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gridSmall)"/><path d="M100 0H0V100" fill="none" stroke="#e5e8eb" stroke-width="1.5"/></pattern>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
          </defs>
          <rect id="paper" x="-50000" y="-50000" width="100000" height="100000" fill="#ffffff"/>
          <rect id="gridRect" x="-50000" y="-50000" width="100000" height="100000" fill="url(#gridBig)"/>
          <image id="bgImage" x="0" y="0" width="1600" height="1000" preserveAspectRatio="xMidYMid meet" visibility="hidden"/>
          <g id="layerGlow"></g>
          <g id="layerStrokes"></g>
          <g id="layerLights"></g>
          <g id="layerTexts"></g>
          <g id="layerSelect"></g>
        </svg>
      </div>

      <div class="toolbar" id="toolbar">
        <button class="tool" data-tool="select" type="button" title="선택 · 옮기기 (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span>선택</span></button>
        <button class="tool active" data-tool="pen" type="button" title="펜 (P)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>펜</span></button>
        <button class="tool" data-tool="light" type="button" title="조명 놓기 (L)"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg><span>조명</span></button>
        <button class="tool" data-tool="text" type="button" title="글자 (T)"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v15"/></svg><span>글자</span></button>
        <button class="tool" data-tool="eraser" type="button" title="지우개 (E)"><svg viewBox="0 0 24 24"><path d="M20 20H9L4 15a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8"/></svg><span>지우개</span></button>
        <span class="tool-sep"></span>
        <button class="tool" id="undoBtn" type="button" title="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>뒤로</span></button>
        <button class="tool" id="redoBtn" type="button" title="다시 (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span>앞으로</span></button>
      </div>

      <div class="pen-opts" id="penOpts">
        <div class="swatches" id="swatches"></div>
        <div class="widths" id="widths"></div>
      </div>

      <aside class="panel" id="panel">
        <div class="panel-grip" id="panelGrip"></div>
        <div class="panel-inner">
          <section id="propBox" hidden></section>

          <section>
            <h3 class="panel-h">조명 <span id="lightCount" class="panel-n"></span></h3>
            <p class="panel-empty" id="lightEmpty">아래 "조명" 도구를 고르고 도화지를 누르면 조명이 놓여요.</p>
            <ul class="light-list" id="lightList"></ul>
          </section>

          <section>
            <h3 class="panel-h">앞으로 할 일 <span id="todoCount" class="panel-n"></span></h3>
            <ul class="todo-list" id="todoList"></ul>
            <form class="todo-add" id="todoForm">
              <input class="field" id="todoText" maxlength="300" placeholder="할 일 적기 (예: 거실 2700K로 교체)" />
              <input class="field date" id="todoDate" type="date" aria-label="날짜" />
              <button class="btn small" type="submit">추가</button>
            </form>
          </section>

          <section>
            <h3 class="panel-h">계획 메모</h3>
            <textarea class="field" id="planNote" rows="6" maxlength="20000" placeholder="전체 방향, 예산, 사야 할 것, 참고한 레퍼런스 등을 자세히 적어두세요"></textarea>
          </section>
        </div>
      </aside>
    </div>
  </div>

  <input type="file" id="bgInput" accept="image/*" hidden />

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin.js" type="module"></script>
</body>
</html>
