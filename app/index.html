<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>레퍼런스</title>
  <meta name="description" content="사진과 메모로 모으는 나만의 아이디어 아카이브" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="레퍼런스" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand" id="brand">레퍼런스</h1>
      <div class="top-actions">
        <button class="text-btn" id="loginBtn" type="button">로그인</button>
        <button class="key-btn" id="adminBtn" type="button" title="관리 · 작업 계획 (키보드 \ 키)">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>계획</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- 전체 레퍼런스 -->
    <section id="view-home" class="view">
      <div class="cat-tabs" id="catTabs" role="tablist" aria-label="분류"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="제목, 작가, 전시관, 메모, 태그로 찾기" autocomplete="off" />
      </label>

      <div class="filter-row">
        <button class="select-chip" id="artistFilterBtn" type="button"><span id="artistFilterLabel">모든 작가</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="select-chip" id="sortBtn" type="button"><span id="sortLabel">최신순</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="select-chip" id="viewModeBtn" type="button" aria-label="보기 방식 바꾸기"><span id="viewModeLabel">사진으로</span></button>
      </div>
      <div class="chips" id="tagChips"></div>

      <p class="count" id="resultCount"></p>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </section>

    <!-- 작가별 -->
    <section id="view-artists" class="view" hidden>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="artistSearch" type="search" placeholder="작가 이름 찾기" autocomplete="off" />
      </label>
      <ul class="list" id="artistList"></ul>
      <div class="empty" id="artistEmpty" hidden></div>
    </section>

    <!-- 작가 한 명 -->
    <section id="view-artist" class="view" hidden>
      <button class="back" id="artistBack" type="button"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>작가 목록</button>
      <div class="artist-head">
        <div class="avatar big" id="artistAvatar"></div>
        <div>
          <h2 class="artist-name" id="artistName"></h2>
          <p class="sub" id="artistCount"></p>
        </div>
      </div>
      <div class="card ai-card">
        <div class="ai-top">
          <span class="badge" id="aiBadge">작가 소개</span>
          <div class="ai-actions">
            <button class="text-btn small" id="aiEditBtn" type="button">직접 쓰기</button>
            <button class="btn small" id="aiBtn" type="button">AI로 설명 만들기</button>
          </div>
        </div>
        <p class="ai-text" id="aiText"></p>
        <textarea class="field ai-edit" id="aiEdit" rows="6" hidden></textarea>
        <div class="ai-edit-actions" id="aiEditActions" hidden>
          <button class="btn ghost small" id="aiEditCancel" type="button">취소</button>
          <button class="btn small" id="aiEditSave" type="button">저장</button>
        </div>
        <ul class="sources" id="aiSources"></ul>
        <p class="ai-note" id="aiNote"></p>
      </div>
      <h3 class="section-title">이 작가의 레퍼런스</h3>
      <div class="grid" id="artistGrid"></div>
    </section>
  </main>

  <button class="fab" id="addBtn" type="button" aria-label="레퍼런스 추가">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab active" data-tab="home" type="button">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      <span>전체</span>
    </button>
    <button class="tab" data-tab="artists" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span>작가별</span>
    </button>
  </nav>

  <!-- 바텀시트 (상세 · 추가/수정 · 선택 · 로그인 공용) -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="viewer" id="viewer" hidden>
    <button class="viewer-close" id="viewerClose" type="button" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <img id="viewerImg" alt="" />
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
